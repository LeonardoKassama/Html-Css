<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Imagens Dinâmicas</title>
</head>
<body>
    <h1>Imagens Dinâmicas</h1>
    <p>
        Tente abrir esse site em diferentes dispositivos ou simplistemnte aumente e diminua o tamanho do seu navegador.
    </p>
    <picture>
        <source media="(max-width: 750px)" srcset="images/imagem-p.png" type="image/png">
        <source media="(max-width: 1050px)" srcset="images/imagem-m.png" type="image/png">
        <img src="images/imagem-g.png" alt="Imagem flexivel">
    </picture>

    <h1>Reproduzindo Audio</h1>
    <p>Vamos a prender a reproduzir audios em HTML5</p>

    <!-- <audio src="midia/free-instrumental.mp3" controls></audio> -->

    <audio preload="metadata" controls>
        <source src="midia/free-instrumental.mp3" type="audio/mpeg">
        <source src="midia/free-instrumental.ogg" type="audio/ogg">
        <source src="midia/free-instrumental.wav" type="audio/wav">
        <p>Infelizmente seu navegador não consegue reproduzir audio. <a href="midia/free-instrumental.mp3">Clique aqui para baixar o arquivo MP3</a></p>
    </audio>

    <!-- Não é recomendado usar arquivos .wav nos sites (já que estes são muito pesados) -->
</body>
</html>

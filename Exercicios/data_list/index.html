<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data List</title>
</head>
<body>
    <h2>Data List</h2>
    <p>This is an exemple of a simple <strong>data list</strong></p>
    <form>
        <input name="movie" placeholder="Movie" list="movies">
        <datalist id="movies">
            <option value="Hereditary">
            <option value="It"></option>
            <option value="It Lives Inside"></option>
            <option value="Talk to me"></option>
            <option value="Avengers"></option>
            <option value="Man of steel"></option>
            <option value="Argile"></option>
        </datalist>
    </form>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fontes Locais</title>

    <style>
        @font-face {
            font-family: 'lover';
            src: url('fonts/LOVERBOY.TTF') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        h1 {
            font-family: 'lover', Times, serif;
            font-size: 3em;
            font-weight: normal;
            color: rgb(219, 75, 152);
        }
    </style>
</head>
<body>
    <h1>Olá, Mundo!</h1>
    <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Laudantium modi rem impedit pariatur suscipit nisi! Assumenda quo nam atque, repellendus inventore doloribus in et reprehenderit, esse sed nihil neque optio?</p>
</body>
</html>
